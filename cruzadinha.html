<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Cruzadinha - ArqComp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-game">
  <header class="topbar card">
    <a href="index.html" class="btn btn-ghost">Voltar para home</a>
    <h1>Cruzadinha de Arquitetura Computacional</h1>
    <p class="subtitle">Preencha as palavras do PDF e valide suas respostas.</p>
  </header>

  <main class="game-layout">
    <section class="board-panel card">
      <div class="actions">
        <button id="checkBtn" class="btn btn-primary" type="button">Conferir</button>
        <button id="resetBtn" class="btn btn-secondary" type="button">Reiniciar</button>
        <p id="score" class="score">0 de 16 palavras corretas</p>
      </div>
      <div id="board" class="board" aria-label="Tabuleiro de palavras cruzadas"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </section>

    <aside class="clues-panel card">
      <h2>Dicas</h2>
      <div class="clues-grid">
        <section>
          <h3>Horizontais</h3>
          <ol id="acrossClues" class="clue-list"></ol>
        </section>
        <section>
          <h3>Verticais</h3>
          <ol id="downClues" class="clue-list"></ol>
        </section>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
